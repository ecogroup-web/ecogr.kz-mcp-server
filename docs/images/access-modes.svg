<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
  <title>Access modes: guest, token user, token manager</title>
  <rect width="920" height="420" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="919" height="419" fill="none" stroke="#e2e8f0"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">What each mode can do</text>

  <!-- column headers -->
  <rect x="270" y="50" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="370" y="74" text-anchor="middle" font-weight="700" fill="#334155">Guest</text><text x="370" y="94" text-anchor="middle" font-size="12" fill="#475569">no Authorization header</text>
  <rect x="480" y="50" width="200" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="580" y="74" text-anchor="middle" font-weight="700" fill="#1e3a8a">Token: client / employee</text><text x="580" y="94" text-anchor="middle" font-size="12" fill="#1e3a8a">Bearer, ability mcp:use</text>
  <rect x="690" y="50" width="200" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="790" y="74" text-anchor="middle" font-weight="700" fill="#14532d">Token: manager</text><text x="790" y="94" text-anchor="middle" font-size="12" fill="#14532d">+ client_id for own clients</text>

  <g font-size="13" fill="#0f172a">
    <text x="24" y="146" font-weight="600">Public catalog, search, compare</text>
    <text x="24" y="186" font-weight="600">Site info, contacts, delivery, service centers</text>
    <text x="24" y="226" font-weight="600">Your own prices, discounts, stock view</text>
    <text x="24" y="266" font-weight="600">Draft carts, preview, confirmation link</text>
    <text x="24" y="306" font-weight="600">Orders, statuses, whoami, personal get_account</text>
    <text x="24" y="346" font-weight="600">Work on behalf of a client (find_client)</text>
    <text x="24" y="386" font-weight="600">Cart handoff link without a token</text>
  </g>
  <g stroke="#e2e8f0"><line x1="24" y1="160" x2="896" y2="160"/><line x1="24" y1="200" x2="896" y2="200"/><line x1="24" y1="240" x2="896" y2="240"/><line x1="24" y1="280" x2="896" y2="280"/><line x1="24" y1="320" x2="896" y2="320"/><line x1="24" y1="360" x2="896" y2="360"/></g>

  <!-- marks: yes = green check, no = grey dash, special = text -->
  <g font-size="22" text-anchor="middle" font-weight="700">
    <text x="370" y="148" fill="#16a34a">&#10003;</text><text x="580" y="148" fill="#16a34a">&#10003;</text><text x="790" y="148" fill="#16a34a">&#10003;</text>
    <text x="370" y="188" fill="#16a34a">&#10003;</text><text x="580" y="188" fill="#16a34a">&#10003;</text><text x="790" y="188" fill="#16a34a">&#10003;</text>
    <text x="370" y="228" fill="#94a3b8">&#8212;</text><text x="580" y="228" fill="#16a34a">&#10003;</text><text x="790" y="228" fill="#16a34a">&#10003;</text>
    <text x="370" y="268" fill="#94a3b8">&#8212;</text><text x="580" y="268" fill="#16a34a">&#10003;</text><text x="790" y="268" fill="#16a34a">&#10003;</text>
    <text x="370" y="308" fill="#94a3b8">&#8212;</text><text x="580" y="308" fill="#16a34a">&#10003;</text><text x="790" y="308" fill="#16a34a">&#10003;</text>
    <text x="370" y="348" fill="#94a3b8">&#8212;</text><text x="580" y="348" fill="#94a3b8">&#8212;</text><text x="790" y="348" fill="#16a34a">&#10003;</text>
    <text x="370" y="388" fill="#16a34a">&#10003;</text><text x="580" y="388" fill="#94a3b8">&#8212;</text><text x="790" y="388" fill="#94a3b8">&#8212;</text>
  </g>
</svg>
