<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
  <title>Ordering flow: AI builds a draft, human sends the order</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
  <rect width="920" height="640" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="919" height="639" fill="none" stroke="#e2e8f0"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Ordering flow</text>

  <!-- lifelines -->
  <rect x="60" y="50" width="170" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6"/><text x="145" y="73" text-anchor="middle" font-weight="700" fill="#1e3a8a">AI agent</text>
  <rect x="375" y="50" width="170" height="36" rx="8" fill="#f0fdf4" stroke="#22c55e"/><text x="460" y="73" text-anchor="middle" font-weight="700" fill="#14532d">MCP server /mcp</text>
  <rect x="690" y="50" width="170" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b"/><text x="775" y="73" text-anchor="middle" font-weight="700" fill="#92400e">Human + site cart</text>
  <g stroke="#cbd5e1" stroke-dasharray="5 5" stroke-width="1.5">
    <line x1="145" y1="86" x2="145" y2="620"/><line x1="460" y1="86" x2="460" y2="620"/><line x1="775" y1="86" x2="775" y2="620"/>
  </g>

  <g stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="145" y1="112" x2="460" y2="112"/>
    <line x1="460" y1="152" x2="145" y2="152" stroke-dasharray="6 4"/>
    <line x1="145" y1="190" x2="460" y2="190"/>
    <line x1="460" y1="228" x2="145" y2="228" stroke-dasharray="6 4"/>
    <line x1="145" y1="266" x2="460" y2="266"/>
    <line x1="460" y1="304" x2="145" y2="304" stroke-dasharray="6 4"/>
    <line x1="145" y1="342" x2="460" y2="342"/>
    <line x1="460" y1="380" x2="145" y2="380" stroke-dasharray="6 4"/>
    <line x1="145" y1="418" x2="460" y2="418"/>
    <line x1="460" y1="456" x2="145" y2="456" stroke-dasharray="6 4"/>
    <line x1="145" y1="494" x2="775" y2="494"/>
    <line x1="775" y1="544" x2="460" y2="544"/>
    <line x1="145" y1="590" x2="460" y2="590"/>
    <line x1="460" y1="608" x2="145" y2="608" stroke-dasharray="6 4"/>
  </g>

  <g fill="#0f172a">
    <text x="302" y="106" text-anchor="middle">1. search_products(query, filters)</text>
    <text x="302" y="146" text-anchor="middle" fill="#475569">cards + total + facets</text>
    <text x="302" y="184" text-anchor="middle">2. get_product_offers(product_ids)</text>
    <text x="302" y="222" text-anchor="middle" fill="#475569">price, stock, multiplicity, min qty</text>
    <text x="302" y="260" text-anchor="middle">3. create_cart_draft(items, idempotency_key)</text>
    <text x="302" y="298" text-anchor="middle" fill="#475569">draft_id, version, adjustments</text>
    <text x="302" y="336" text-anchor="middle">4. update_cart_draft(draft_id, items)</text>
    <text x="302" y="374" text-anchor="middle" fill="#475569">new version, adjustments</text>
    <text x="302" y="412" text-anchor="middle">5. preview_order(draft_id)</text>
    <text x="302" y="450" text-anchor="middle" fill="#475569">totals, carts, warnings[]</text>
    <text x="460" y="488" text-anchor="middle">6. request_order_confirmation(draft_id)  -  one-time link</text>
  </g>
  <rect x="150" y="500" width="250" height="26" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="275" y="518" text-anchor="middle" fill="#991b1b" font-size="12">AI gives the link to the human as is</text>

  <text x="618" y="538" text-anchor="middle" fill="#0f172a">7. human opens link (same account)</text>
  <rect x="560" y="552" width="330" height="26" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="725" y="570" text-anchor="middle" fill="#92400e" font-size="12">cart "MCP goods": check, delivery, SEND ORDER</text>

  <text x="302" y="584" text-anchor="middle" fill="#0f172a">8. get_orders / get_cart_draft</text>
  <text x="302" y="626" text-anchor="middle" fill="#475569">order status (incl. reserve status)</text>
</svg>
