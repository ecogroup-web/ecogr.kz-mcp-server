<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
  <title>Map of the 22 MCP tools by group</title>
  <rect width="920" height="470" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="919" height="469" fill="none" stroke="#e2e8f0"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">22 tools by group</text>

  <!-- Catalog -->
  <rect x="24" y="52" width="280" height="200" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="164" y="76" text-anchor="middle" font-weight="700" fill="#1d4ed8">Catalog (guest + token)</text>
  <g fill="#1e3a8a" font-family="Consolas,Menlo,monospace" font-size="13">
    <text x="44" y="108">search_products</text>
    <text x="44" y="136">get_product_offers</text>
    <text x="44" y="164">compare_products</text>
    <text x="44" y="192">compare_brands</text>
  </g>
  <text x="44" y="226" font-size="12" fill="#1e3a8a">find_client (manager only, token)</text>

  <!-- Info -->
  <rect x="320" y="52" width="280" height="200" rx="10" fill="#fefce8" stroke="#eab308"/>
  <text x="460" y="76" text-anchor="middle" font-weight="700" fill="#854d0e">Site information (guest + token)</text>
  <g fill="#713f12" font-family="Consolas,Menlo,monospace" font-size="13">
    <text x="340" y="104">search_site_pages</text>
    <text x="340" y="130">get_site_page</text>
    <text x="340" y="156">get_company_info</text>
    <text x="340" y="182">get_company_contacts</text>
    <text x="340" y="208">get_delivery_schedule</text>
    <text x="340" y="234">find_service_centers</text>
  </g>

  <!-- Cart -->
  <rect x="616" y="52" width="280" height="200" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="756" y="76" text-anchor="middle" font-weight="700" fill="#15803d">Draft cart (token only)</text>
  <g fill="#14532d" font-family="Consolas,Menlo,monospace" font-size="13">
    <text x="636" y="108">create_cart_draft</text>
    <text x="636" y="136">update_cart_draft</text>
    <text x="636" y="164">get_cart_draft</text>
    <text x="636" y="192">preview_order</text>
    <text x="636" y="220">request_order_confirmation</text>
  </g>

  <!-- Orders -->
  <rect x="24" y="272" width="280" height="150" rx="10" fill="#faf5ff" stroke="#a855f7"/>
  <text x="164" y="296" text-anchor="middle" font-weight="700" fill="#7e22ce">Orders (token only)</text>
  <g fill="#581c87" font-family="Consolas,Menlo,monospace" font-size="13">
    <text x="44" y="328">get_orders</text>
    <text x="44" y="356">get_order_status</text>
  </g>
  <text x="44" y="392" font-size="12" fill="#581c87">read-only: orders are sent by a human</text>

  <!-- Guest handoff -->
  <rect x="320" y="272" width="280" height="150" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="460" y="296" text-anchor="middle" font-weight="700" fill="#334155">No token (guest only)</text>
  <g fill="#334155" font-family="Consolas,Menlo,monospace" font-size="13">
    <text x="340" y="328">create_guest_cart_handoff</text>
  </g>
  <text x="340" y="362" font-size="12" fill="#334155">one-time link: the human opens the</text>
  <text x="340" y="380" font-size="12" fill="#334155">site cart and signs in to see own prices</text>

  <!-- Service -->
  <rect x="616" y="272" width="280" height="150" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="756" y="296" text-anchor="middle" font-weight="700" fill="#c2410c">Service / identity</text>
  <g fill="#7c2d12" font-family="Consolas,Menlo,monospace" font-size="13">
    <text x="636" y="328">server_info (guest + token)</text>
    <text x="636" y="356">get_account (guest + token)</text>
    <text x="636" y="384">whoami (token only)</text>
  </g>
</svg>
